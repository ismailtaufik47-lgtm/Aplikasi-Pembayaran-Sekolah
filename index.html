<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3B6EF6" />
    <!-- Tanpa ini, sebagian Android/Chrome "menggelapkan" warna cerah secara
         otomatis (dark theme heuristic) — tombol biru bisa tampil gelap/hitam
         padahal kodenya tetap biru. Baris ini memberi tahu browser: halaman
         ini memang dirancang untuk mode terang, jangan diubah. -->
    <meta name="color-scheme" content="light" />
    <!-- Pasang mode gelap SEBELUM aplikasi dimuat supaya tidak berkedip putih.
         Logikanya sama dengan src/lib/tema.js (kunci localStorage 'tema'). -->
    <script>
      (function () {
        // Aplikasi guru kelas "Tumbuh Ceria" (/kelas, tumbuh.kasceria.my.id):
        // warna hijau & identitas sendiri — dipasang sebelum aplikasi dimuat
        // supaya tidak sempat tampil biru Kasceria.
        var p = location.pathname
        var kelas = p === '/kelas' || p.indexOf('/kelas/') === 0 || /^(tumbuh|guru)\./.test(location.hostname)
        if (kelas) {
          document.documentElement.classList.add('tema-kelas')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C9473')
        }
        try {
          var t = localStorage.getItem('tema') || 'terang'
          var gelap = t === 'gelap' || (t === 'otomatis' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (gelap) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', kelas ? '#0D1A18' : '#0F131B')
          }
        } catch (e) {}
      })()
    </script>
    <title>Kasceria — Sahabat Keuangan Sekolah</title>
    <meta name="description" content="Kasceria: catat SPP, biaya kegiatan, dan buku kas TK dalam satu aplikasi." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA: tiga aplikasi terpisah dari satu situs —
         /guru  → "Kasceria" (kepala sekolah & TU)
         /kelas → "Tumbuh Ceria" (guru kelas: tumbuh kembang anak), ikon hijau sendiri
         /ortu  → "Kabar Ananda" (portal orang tua, kabarananda.my.id), ikon grafik bertunas sendiri
         Di iPhone, portal orang tua sengaja TANPA manifest: iPhone lalu memakai
         alamat yang sedang dibuka (lengkap dengan token wali) sebagai alamat
         aplikasinya, karena aplikasi di layar utama iPhone tidak berbagi
         penyimpanan dengan Safari. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        var p = location.pathname
        var wali = p === '/ortu' || p.indexOf('/ortu/') === 0 ||
          (/(^|\.)kabarananda\./.test(location.hostname) && p.indexOf('/verifikasi') !== 0)
        var kelas = document.documentElement.classList.contains('tema-kelas')
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
        var judul = document.createElement('meta')
        judul.name = 'apple-mobile-web-app-title'
        judul.content = wali ? 'Kabar Ananda' : kelas ? 'Tumbuh Ceria' : 'Kasceria'
        document.head.appendChild(judul)
        if (wali) {
          document.title = 'Kabar Ananda — Kabar & Tagihan Ananda'
          document.querySelector('meta[name="description"]').setAttribute('content', 'Kabar Ananda: kabar perkembangan, tagihan, dan kuitansi ananda di TK.')
          document.querySelector('link[rel="icon"]').setAttribute('href', '/favicon-ortu.svg')
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', '/icons/ortu-apple-touch-icon.png')
        }
        if (kelas) {
          document.title = 'Tumbuh Ceria — Catatan Tumbuh Kembang Anak'
          document.querySelector('meta[name="description"]').setAttribute('content', 'Tumbuh Ceria: ceklis perkembangan, catatan anak, dan kabar kelas untuk guru TK.')
          document.querySelector('link[rel="icon"]').setAttribute('href', '/favicon-kelas.svg')
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', '/icons/kelas-apple-touch-icon.png')
        }
        if (p.indexOf('/admin') === 0 || p.indexOf('/verifikasi') === 0 || (wali && ios)) return
        var m = document.createElement('link')
        m.rel = 'manifest'
        m.href = wali ? '/manifest-wali.webmanifest' : kelas ? '/manifest-kelas.webmanifest' : '/manifest.webmanifest'
        document.head.appendChild(m)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
