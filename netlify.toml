[build]
  command = "npm run build"
  publish = "dist"

# Header keamanan (v35): tidak bisa dibingkai situs lain (clickjacking), browser tidak menebak
# jenis file, dan alamat lengkap (termasuk token portal di /ortu/...) tidak dikirim ke situs lain.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA: service worker & manifest harus selalu dicek ulang supaya update langsung terpakai
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# file build bernama hash → aman disimpan lama
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
